# fleng settings. Read at startup from the working directory,
# or pass another file: ./build/release/fleng my.toml
# Anything left out falls back to the built-in default.

[window]
width = 500
height = 500
framerate_limit = 60
title = "fleng"

[paths]
shaders = "shaders/"
image = "assets/image.jpg"
video = "assets/video.mp4"

[render]
march_iterations = 200   # starting value; 3 / 4 keys change it live

[camera]
matrix_size = 0.001      # smaller = narrower field of view; - / = keys change it live
speed = 0.2              # 5 / 6 keys divide / multiply by 10
rotation_angle = 0.05    # radians per frame while an arrow key is held

[water]
enabled = true
scene = "drop"                 # still_tank | dam_break | drop
resolution = 32                # cells across the tank; cost grows ~16× per doubling
realtime = true                # never run ahead of the clock (slow motion when it can't keep up)
position = [-0.5, -1.0, 5.0]   # world position of the middle of the tank's floor
scale = 10                     # world units per meter (the drop tank is 0.3 m wide)
absorption = [0.34, 0.057, 0.0092]  # per meter, red/green/blue: pure water
ior = 1.33
# Keys: R restarts the water, T pauses it, F12 saves a screenshot.
